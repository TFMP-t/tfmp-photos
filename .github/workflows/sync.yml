name: Sync TFMP Photos

on:
  # يشتغل لوحده كل يوم من الأحد للخميس، الساعة 6 الصبح (بتوقيت السعودية / جدة، UTC+3)
  # الجمعة والسبت إجازة، مفيش تشغيل تلقائي فيهم
  schedule:
    - cron: '0 3 * * 0-4'
  # ده بيديك زرار "Run workflow" تدوس عليه يدوي لو عايز تسحب فورًا من غير ما تستنى
  workflow_dispatch:

permissions:
  contents: write

# لو حصل تشغيل يدوي في نفس وقت التشغيل التلقائي، ده بيمنع اتنين يشتغلوا في نفس الوقت
# ويسبب تعارض في رفع النتيجة على GitHub
concurrency:
  group: tfmp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # حد أقصى 5 ساعات ونص للتشغيل الواحد (جيت هاب بيوقف أي حاجة إجباريًا بعد 6 ساعات مهما حصل)
    timeout-minutes: 330
    steps:
      - name: تنزيل نسخة من الـ repo
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت المكتبة المطلوبة
        run: npm install node-fetch@2

      - name: تشغيل سكريبت السحب والبناء
        env:
          TFMP_USERNAME: ${{ secrets.TFMP_USERNAME }}
          TFMP_PASSWORD: ${{ secrets.TFMP_PASSWORD }}
        run: node sync-and-build.js

      - name: حفظ ورفع النتيجة
        # if: always() يضمن إن أي حاجة اتسحبت تتحفظ وتترفع حتى لو حصلت مشكلة فوق
        if: always()
        run: |
          git config user.name "tfmp-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "مفيش حاجة جديدة تتحفظ"
          else
            git commit -m "تحديث تلقائي للصور والداتا"
            # محاولة الرفع لحد 3 مرات لو حصل عطل شبكة مؤقت
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "فشلت محاولة الرفع رقم $i، بيحاول تاني..."
              git pull --rebase
              sleep 5
            done
          fi
