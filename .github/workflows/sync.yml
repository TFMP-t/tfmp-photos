name: Sync TFMP Photos

on:
  # يشتغل لوحده كل يوم الساعة 6 الصبح (بتوقيت السعودية / جدة، UTC+3)
  schedule:
    - cron: '0 3 * * *'
  # ده بيديك زرار "Run workflow" تدوس عليه يدوي لو عايز تسحب فورًا من غير ما تستنى الصبح
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: تنزيل نسخة من الـ repo
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت المكتبة المطلوبة
        run: npm install node-fetch@2

      - name: تشغيل سكريبت السحب والبناء
        env:
          TFMP_SESSION_COOKIE: ${{ secrets.TFMP_SESSION_COOKIE }}
        run: node sync-and-build.js

      - name: حفظ ورفع النتيجة
        run: |
          git config user.name "tfmp-bot"
          git config user.email "actions@github.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "تحديث تلقائي للصور والداتا"
          git push
