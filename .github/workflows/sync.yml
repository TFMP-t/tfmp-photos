name: Sync school photos and publish

on:
  schedule:
    - cron: '0 */6 * * *'   # كل 6 ساعات
  workflow_dispatch:         # يخليك تشغّله يدويًا من تبويب Actions لو عايز

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-fetch@2

      - name: Run sync and build
        env:
          TFMP_SESSION_COOKIE: ${{ secrets.TFMP_SESSION_COOKIE }}
        run: node sync-and-build.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data docs
          git diff --quiet && git diff --staged --quiet || git commit -m "تحديث تلقائي للصور والداتا"
          git push
