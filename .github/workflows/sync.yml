name: Sync TFMP Photos

on:
  # يعمل تلقائيًا كل يوم من الأحد إلى الخميس، الساعة السادسة صباحًا (بتوقيت السعودية / جدة، UTC+3)
  # الجمعة والسبت عطلة، ولا يوجد تشغيل تلقائي فيهما
  schedule:
    - cron: '0 3 * * 0-4'
  # يتيح هذا زر "Run workflow" للتشغيل اليدوي فورًا دون انتظار الموعد المجدوَل
  workflow_dispatch:

permissions:
  contents: write

# إذا حدث تشغيل يدوي في نفس وقت التشغيل التلقائي، فإن هذا يمنع عمل تشغيلين في آنٍ واحد
# ويمنع بالتالي حدوث تعارض عند رفع النتيجة إلى GitHub
concurrency:
  group: tfmp-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # حد أقصى قدره 5 ساعات ونصف للتشغيل الواحد (تُوقف GitHub أي تشغيل إجباريًا بعد 6 ساعات مهما حدث)
    timeout-minutes: 330
    steps:
      - name: تنزيل نسخة من المستودع
        uses: actions/checkout@v4

      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت المكتبات المطلوبة
        # تُستخدم مكتبة sharp لضغط الصور وتصغيرها قبل حفظها، لتقليل حجمها بشكل كبير
        run: npm install node-fetch@2 sharp

      - name: تشغيل النص البرمجي للسحب والبناء
        # يقوم النص البرمجي الآن برفع (commit + push) الصور الجديدة أولًا بأول أثناء عملية السحب
        # نفسها (كل دقيقة تقريبًا)، بدلًا من تجميعها كلها حتى نهاية التشغيل - وهذا يقلل احتمال
        # أن يستغرق آخر عملية push وقتًا طويلًا أو أن تتوقف بيئة التشغيل بسبب نفاد الذاكرة أو المساحة.
        # كما يراقب النص البرمجي مساحة القرص بنفسه ويتوقف عن سحب بيانات جديدة إذا أوشكت المساحة على النفاد
        env:
          TFMP_USERNAME: ${{ secrets.TFMP_USERNAME }}
          TFMP_PASSWORD: ${{ secrets.TFMP_PASSWORD }}
        run: node sync-and-build.js

      - name: حفظ ورفع النتيجة
        # if: always() يضمن حفظ ورفع أي بيانات تم سحبها حتى لو حدثت مشكلة في الخطوة السابقة
        if: always()
        # ملحوظة مهمة: لا يُستخدم هنا الأمر "git add docs/" (على المجلد بأكمله) — لأن هذا
        # يجعل git يقوم بعملية stat+hash لكل صورة تم سحبها منذ اليوم الأول (وليس الجديدة فقط)،
        # وهذا على الأرجح ما كان يتسبب في رسالة "lost communication with the server": عملية
        # طويلة وصامتة (بلا أي ناتج جديد) تستهلك المعالج والقرص بشكل متصاعد كلما كبر المستودع.
        # الرفع التدريجي داخل النص البرمجي أصلًا يرفع كل شيء أولًا بأول، لذا يُفترض بهذه
        # الخطوة أن "تلحق" فقط بآخر دقيقة أو دقيقتين، لا أن تعيد فحص كل شيء من جديد.
        timeout-minutes: 20
        run: |
          set -x
          git config user.name "tfmp-bot"
          git config user.email "actions@github.com"

          echo "المساحة المتاحة على القرص في بيئة التشغيل:"
          df -h .

          echo "حجم مجلد docs الحالي:"
          du -sh docs 2>/dev/null || true

          # مهم: لا تُضف docs/photos هنا مرة أخرى. النص البرمجي يرفع الصور تدريجيًا
          # (commit+push) كل دقيقة أثناء عمله، لذا يُفترض أن جميع الصور قد أُضيفت
          # ورُفعت بالفعل. فإذا أضفناها هنا أيضًا، سيقوم git بعمل stat لآلاف الصور
          # القديمة دون أي فائدة (فكلها مرفوعة بالفعل عبر commit سابق)، وهذا ما كان
          # يسبب التعليق واستهلاك الموارد. نكتفي هنا بملفات البيانات التي تُحدَّث
          # في اللحظة الأخيرة فقط (وهي صغيرة وسريعة).
          git add -A -- data/ docs/progress.json docs/progress.html \
            docs/schools-data.json docs/index.html docs/.nojekyll

          # شبكة أمان: إذا كانت هناك صور تم تنزيلها لأي سبب دون أن يتم رفعها (push)
          # من داخل النص البرمجي (مثلًا فشلت آخر عملية رفع تدريجي)، تُلتقط هنا. يُستخدم
          # أمر "git status --porcelain" أولًا لمعرفة ما إذا كان هناك أي تغيير أصلًا
          # قبل تنفيذ "git add" على المجلد بأكمله (فإذا لم يوجد جديد، لا يُنفَّذ
          # فحص شامل وثقيل دون داعٍ)
          if [ -n "$(git status --porcelain docs/photos | head -1)" ]; then
            echo "⚠ توجد صور لم تُضَف ضمن الرفع التدريجي، ويجري إضافتها الآن كشبكة أمان"
            git add -A -- docs/photos
          fi

          if git diff --staged --quiet; then
            echo "لا توجد أي بيانات جديدة تُحفظ الآن"
          else
            git commit -q -m "تحديث تلقائي للصور والبيانات"
          fi

          # يُنفَّذ الرفع دائمًا هنا (حتى لو لم يوجد commit جديد الآن)، لأنه قد يكون
          # هناك commit سابق تم إنشاؤه داخل النص البرمجي نفسه لكن فشل رفعه (مثلًا بسبب
          # انقطاع شبكة مؤقت)؛ فإذا اكتفينا بتخطي الرفع هنا لعدم وجود شيء جديد الآن،
          # سيبقى ذلك الـ commit عالقًا محليًا ولن يُرفع أبدًا. رفع فرع لا يحتوي على
          # أي commit جديد غير مضرّ إطلاقًا وينجح فورًا دون تنفيذ أي شيء.
          for i in 1 2 3; do
            if git push -q; then
              echo "✔ نجحت عملية الرفع في المحاولة رقم $i"
              break
            fi
            echo "⚠ فشلت محاولة الرفع رقم $i، وتجري إعادة المحاولة..."
            git pull --rebase -q
            sleep 5
          done
